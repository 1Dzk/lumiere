<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lumiere · Documentação da API</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='21' cy='12' r='9' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Ccircle cx='15' cy='16' r='11' fill='%23e9b44c' mask='url(%23m)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/docs/lumiere-docs.css">
</head>
<body>

<div class="layout">

  <aside class="lateral">
    <a class="marca" href="#visao-geral" aria-label="Lumiere">
      <svg class="marca-logo" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <defs>
          <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6d58a"/>
            <stop offset="1" stop-color="#d98f2b"/>
          </linearGradient>
          <mask id="lua">
            <rect width="32" height="32" fill="#fff"/>
            <circle cx="21" cy="12" r="9" fill="#000"/>
          </mask>
        </defs>
        <circle cx="15" cy="16" r="11" fill="url(#ouro)" mask="url(#lua)"/>
      </svg>
      <span class="marca-nome">Lumiere</span>
    </a>

    <label class="filtro">
      <span class="sr-only">Filtrar endpoints</span>
      <input id="filtro" type="search" placeholder="Filtrar endpoints…" autocomplete="off" spellcheck="false">
    </label>

    <nav id="navegacao" aria-label="Seções da documentação"></nav>
  </aside>

  <main id="app" class="conteudo">
    <p class="carregando">Carregando a documentação…</p>
  </main>

</div>

<script src="/docs/lumiere-docs.js"></script>
</body>
</html>
