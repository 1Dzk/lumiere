services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumiere_auth
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere
    ports:
      - "5434:5432"
    volumes:
      - lumiere_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere -d lumiere_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumiere-net

  postgres-favoritos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumiere_favoritos
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere
    ports:
      - "5433:5432"
    volumes:
      - lumiere_favoritos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere -d lumiere_favoritos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumiere-net

  auth:
    build: ./lumiere-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/lumiere_auth
      SPRING_DATASOURCE_USERNAME: lumiere
      SPRING_DATASOURCE_PASSWORD: lumiere
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - lumiere-net

  catalogo:
    build: ./lumiere-catalogo
    ports:
      - "8082:8082"
    environment:
      TMDB_API_TOKEN: ${TMDB_API_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - lumiere-net

  favoritos:
    build: ./lumiere-favoritos
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-favoritos:5432/lumiere_favoritos
      SPRING_DATASOURCE_USERNAME: lumiere
      SPRING_DATASOURCE_PASSWORD: lumiere
      JWT_SECRET: ${JWT_SECRET}
      CATALOGO_URL: http://catalogo:8082
    depends_on:
      postgres-favoritos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - lumiere-net

  postgres-notificacoes:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumiere_notificacoes
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere
    ports:
      - "5435:5432"
    volumes:
      - lumiere_notificacoes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere -d lumiere_notificacoes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lumiere-net

  notificacoes:
    build: ./lumiere-notificacoes
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notificacoes:5432/lumiere_notificacoes
      SPRING_DATASOURCE_USERNAME: lumiere
      SPRING_DATASOURCE_PASSWORD: lumiere
      FAVORITOS_URL: http://favoritos:8083
      CATALOGO_URL: http://catalogo:8082
      NOTIFICACOES_INTERVALO_MS: ${NOTIFICACOES_INTERVALO_MS:-60000}
    depends_on:
      postgres-notificacoes:
        condition: service_healthy
      favoritos:
        condition: service_healthy
      catalogo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - lumiere-net

  gateway:
    build: ./lumiere-gateway
    ports:
      - "8080:8080"
    environment:
      LUMIERE_AUTH_URL: http://auth:8081
      LUMIERE_CATALOGO_URL: http://catalogo:8082
      LUMIERE_FAVORITOS_URL: http://favoritos:8083
      LUMIERE_NOTIFICACOES_URL: http://notificacoes:8084
    depends_on:
      auth:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      favoritos:
        condition: service_healthy
      notificacoes:
        condition: service_healthy
    networks:
      - lumiere-net

networks:
  lumiere-net:

volumes:
  lumiere_auth_data:
  lumiere_favoritos_data:
  lumiere_notificacoes_data:
