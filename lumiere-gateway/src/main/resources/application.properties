spring.application.name=lumiere-gateway
server.port=8080

lumiere.auth.url=${LUMIERE_AUTH_URL:http://localhost:8081}
lumiere.catalogo.url=${LUMIERE_CATALOGO_URL:http://localhost:8082}
lumiere.favoritos.url=${LUMIERE_FAVORITOS_URL:http://localhost:8083}
lumiere.notificacoes.url=${LUMIERE_NOTIFICACOES_URL:http://localhost:8084}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}

# Limites de tempo das chamadas aos serviços (ms). O de leitura é folgado porque o "em alta" do
# catálogo faz várias chamadas à TMDB quando o cache está frio. Passou disso: 504.
gateway.timeout.connect-ms=${GATEWAY_TIMEOUT_CONNECT_MS:3000}
gateway.timeout.read-ms=${GATEWAY_TIMEOUT_READ_MS:30000}
